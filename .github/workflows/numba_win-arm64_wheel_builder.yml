name: numba_win-arm64_wheel_builder

on:
  schedule:
    - cron: '30 8 * * 6'  # Saturday 8:30 AM UTC - win-arm64 wheel
  pull_request:
    paths:
      - .github/workflows/numba_win-arm64_wheel_builder.yml
      - buildscripts/github/test_wheel_contents.py
      - setup.py
  workflow_dispatch:
    inputs:
      llvmlite_wheel_runid:
        description: 'llvmlite wheel workflow run ID (optional)'
        required: false
        type: string

# Add concurrency control
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: 7
  WHEELS_INDEX_URL: https://pypi.anaconda.org/numba/label/dev/simple
  NUMPY_VERSION: "2.3.5"

jobs:
  win-arm64-build:
    name: win-arm64-build-wheel (py ${{ matrix.python_version }}, np 2.3.5)
    runs-on: windows-11-arm
    strategy:
      matrix:
        python_version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          architecture: arm64
          installation-dir: C:\Miniconda
          auto-update-conda: true
          auto-activate-base: true
          activate-environment: ""

      - name: Download llvmlite wheel
        if: inputs.llvmlite_wheel_runid != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llvmlite-win-arm64-py${{ env.PYTHON_VERSION }}
          path: llvmlite_wheels
          run-id: ${{ inputs.llvmlite_wheel_runid }}
          repository: numba/llvmlite
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          conda install -c main "python=${PYTHON_VERSION}" pip tbb-devel
          if [ "${{ inputs.llvmlite_wheel_runid }}" != "" ]; then
              python -m pip install llvmlite_wheels/*.whl
          else
              python -m pip install --pre -i ${{ env.WHEELS_INDEX_URL }} llvmlite
          fi
          python -m pip install --pre numpy==${NUMPY_VERSION}
          python -m pip install build "setuptools>=69.0.0" wheel

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Test wheel contents
        run: python buildscripts/github/test_wheel_contents.py dist/*.whl

      - name: Upload numba wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numba_win-arm64_wheel_py${{ env.PYTHON_VERSION }}
          path: dist/*.whl
          compression-level: 0
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  win-arm64-test:
    name: win-arm64-test-wheel (py ${{ matrix.python_version }}, np 2.3.5)
    needs: win-arm64-build
    runs-on: windows-11-arm
    strategy:
      matrix:
        python_version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          architecture: arm64
          installation-dir: C:\Miniconda
          auto-update-conda: true
          auto-activate-base: true
          activate-environment: ""

      - name: Download Numba wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: numba_win-arm64_wheel_py${{ env.PYTHON_VERSION }}
          path: dist

      - name: Download llvmlite wheel
        if: inputs.llvmlite_wheel_runid != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llvmlite-win-arm64-py${{ env.PYTHON_VERSION }}
          path: llvmlite_wheels
          run-id: ${{ inputs.llvmlite_wheel_runid }}
          repository: numba/llvmlite
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install test dependencies
        run: conda install -c main "python=${PYTHON_VERSION}" pip wheel tbb

      - name: Validate and test wheel
        env:
          NUMBA_CPU_NAME: generic
          _NUMBA_REDUCED_TESTING: 1
        run: |
          python -m pip install --upgrade pip twine
          python -m pip install numpy==${NUMPY_VERSION}
          if [ "${{ inputs.llvmlite_wheel_runid }}" != "" ]; then
              python -m pip install llvmlite_wheels/*.whl
          else
              python -m pip install --pre -i ${{ env.WHEELS_INDEX_URL }} llvmlite
          fi
          python -m twine check dist/*.whl
          python -m pip install dist/*.whl

          # print Numba system information
          python -m numba -s

          # run tests
          python -m numba.runtests -m 4 -v
