[mypy]
files = numba/**/*.pyi
exclude = (?x)(
    ^numba/(
      .+\.py$
      | tests/
    )
  )
follow_imports = silent

warn_unused_configs = True
allow_redefinition_new = True
local_partial_types = True
; mypy 2.4's default native parser drops modules that are only imported
; inside function bodies (e.g. CPUContext.refresh), so stubtest reports
; them as 'failed to find stubs'. Use the legacy parser until fixed upstream.
native_parser = False

; TODO
ignore_errors = True

[mypy-llvmlite.*]
ignore_missing_imports = True
